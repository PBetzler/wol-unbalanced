name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python scripts compile
        run: python -m py_compile scripts/*.py
      - name: Repo hygiene — no third-party or generated content committed
        run: |
          test ! -e mods && test ! -e vendor && test ! -e build && test ! -e dist
          if git ls-files | grep -E '\.(SC2Map|zip|exe|dll)$'; then
            echo "forbidden file types committed"; exit 1
          fi
      - name: Galaxy library sanity (braces, parens, declaration order)
        run: python scripts/galaxy_lint.py
      - name: Static catalog/actor audit (actor consistency, calldown wiring)
        run: python scripts/audit.py --quiet
      - name: Preview lens CHECK8 (every runtime per-player edit sits on a verified-applying field class)
        run: python scripts/preview.py --check
      - name: Autocast/trigger CHECK9 (every autocast + reactive trigger matches its declared intent)
        run: python scripts/check_autocast.py
      - name: Merc/hero parity CHECK10 (every base-unit per-player buff reaches its merc/hero counterpart)
        run: python scripts/check_merc_parity.py
      - name: Panel-damage truth CHECK11 (a rerouted weapon's damage panel equals the player's fired number)
        run: python scripts/check_panel_damage.py
      - name: Dispatch-doctrine guard (CLAUDE.md PM/dispatch rules ↔ hook enforcement in sync)
        run: python scripts/check_dispatch_doctrine.py --quiet
