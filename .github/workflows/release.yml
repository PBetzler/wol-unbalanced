name: Release

# Tag-triggered CCM zip release. CI cannot rebuild the campaign maps (the map
# base is not redistributed through this repo), so this workflow takes the most
# recent existing release zip as the map carrier, swaps in the current mod
# (src/mod -> WoLUnbalanced.SC2Mod), bumps the metadata version, and publishes.
# Bootstrap and map-affecting releases are made locally:
#   python3 scripts/build.py package && gh release create vX.Y.Z dist/*.zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest release zip as map carrier
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "WoL-Unbalanced-*.zip" --output base.zip \
            $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
      - name: Repack with current mod
        run: python3 scripts/repack.py base.zip "$GITHUB_REF_NAME"
      - name: Publish release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes \
              --title "WoL Unbalanced $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
